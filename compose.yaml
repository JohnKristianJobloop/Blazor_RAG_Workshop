services:
  db:
    image: pgvector/pgvector:pg17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_vector_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 30s
      timeout: 30s
      retries: 20
  FullStackApplication:
    image: fullstackapplication
    ports:
      - "8080:8080"
      - "8081:8081"
    build:
      context: .
      dockerfile: FullStackApplication/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mydatabase;Username=user;Password=password;
  ollama:
    image: ollama/ollama:latest
    ports: 
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
    restart: unless-stopped
volumes:
  ollama:
  postgres_vector_database: